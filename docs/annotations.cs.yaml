# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá

GmlLineString:
  posList:
    ndic: "Linie ve směru jízdy od počátku ke konci polohy (u obousměrné polohy v prvním směru). Počátek a konec jsou přesné, mezilehlé body zjednodušené s odchylkou nejvýše 10 m od geometrie úseků GN; souřadnice WGS-84 na 5 desetinných míst (≈ 1 m)."

PercentageDistanceAlongLinearElement:
  percentageDistanceAlong:
    ndic: "Procenta délky úseku 0–100, nejvýše 2 desetinná místa."

LocationGroupByList:
  locationContainedInGroup:
    ndic: "Každý člen skupiny je souvislý úsek jedné komunikace (`SingleRoadLinearLocation`); pořadí členů nemá význam."

ItineraryByIndexedLocations:
  locationContainedInItinerary:
    card: '2..n'
    ndic: "Části trasy v pořadí jízdy, `@index` = 1, 2, …; každá část (`location`) je souvislý úsek jedné komunikace (`SingleRoadLinearLocation`)."

Source:
  sourceIdentification:
    ndic: >-
      Kód zdroje informace (předběžný číselník): `RSD`, `SSU`, `SSU2`, `TSK2`, `PCR`, `USDI`, `DIRC`,
      `FCD` (data z plovoucích vozidel), `PPP-D4`, `OKAS`. Úplný číselník kódů a názvů zdrojů bude doplněn.
