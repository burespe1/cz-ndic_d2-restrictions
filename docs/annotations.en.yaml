# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá

GmlLineString:
  posList:
    ndic: "Line in the direction of travel from the start to the end of the location (for a bidirectional location in the first direction). The start and end are exact, intermediate points are simplified with a deviation of at most 10 m from the GN section geometry; WGS-84 coordinates to 5 decimal places (≈ 1 m)."

PercentageDistanceAlongLinearElement:
  percentageDistanceAlong:
    ndic: "Percent of the section length 0–100, at most 2 decimal places."

LocationGroupByList:
  locationContainedInGroup:
    ndic: "Each member of the group is a contiguous section of one road (`SingleRoadLinearLocation`); the order of the members has no meaning."

ItineraryByIndexedLocations:
  locationContainedInItinerary:
    card: '2..n'
    ndic: "Parts of the route in travel order, `@index` = 1, 2, …; each part (`location`) is a contiguous section of one road (`SingleRoadLinearLocation`)."

Source:
  sourceIdentification:
    ndic: >-
      Code of the information source (preliminary code list): `RSD`, `SSU`, `SSU2`, `TSK2`, `PCR`, `USDI`, `DIRC`,
      `FCD` (floating car data), `PPP-D4`, `OKAS`. The complete list of source codes and names will be added.
